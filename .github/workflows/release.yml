name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            targets: --win portable
            files: release/Instant-TeX-*-Windows.exe
          - os: ubuntu-latest
            platform: Linux
            targets: --linux AppImage
            files: release/*.AppImage
          - os: macos-latest
            platform: macOS
            targets: --mac dmg --mac zip
            files: |
              release/*.dmg
              release/*.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create macOS app icon
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          mkdir -p assets/InstantTeX.iconset
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" assets/icon.png --out "assets/InstantTeX.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" assets/icon.png --out "assets/InstantTeX.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns assets/InstantTeX.iconset -o assets/icon.icns
      - name: Package application
        shell: bash
        run: npx electron-builder ${{ matrix.targets }} --x64 --config.directories.output=release --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instant-tex-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: instant-tex-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Instant TeX $GITHUB_REF_NAME" --generate-notes
